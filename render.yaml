services:
  - type: web
    name: aura-cinematic-portal
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: DATABASE_URL
        fromDatabase:
          name: aura-db
          property: connectionString
      - key: CLOUDINARY_URL
        sync: false

databases:
  - name: aura-db
    plan: free
    databaseName: auradb
    user: aurauser
